services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: techdoc-rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-techdoc_rag}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - ${POSTGRES_DATA_ROOT}/postgres:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-techdoc_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5